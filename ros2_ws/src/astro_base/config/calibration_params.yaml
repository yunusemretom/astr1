# ASTRO Robot Head Gaze & Sensor Calibration Parameters
# Documented and verified for ReSpeaker v3.0, OAK-D Lite, and Mega2560 Actuator

/**:
  ros__parameters:
    head:
      zero_offset_deg: 0.0          # Software calibration zero offset
      # Aşağıdaki ticks_per_deg satırı boyun hareketini 170 derece olarak
      # belgeliyor (440 tick / 170 deg), yani mekanizma ±85 dönüyor. Limit ±75'te
      # kesince kafa, hâlâ görünen ama biraz daha yandaki kişiye erişemeden duruyordu.
      # Firmware ±180'e kadar kabul ediyor (arduino/astro_firmware HEAD_MIN/MAX_DEG);
      # burada ölçülmüş aralığın ötesine geçmiyoruz.
      min_angle_deg: -85.0          # Mechanical safety soft lower limit (degrees)
      max_angle_deg: 85.0           # Mechanical safety soft upper limit (degrees)
      ticks_per_deg: 2.5882         # Empirically verified canonical scale: 440 ticks / 170.0 deg = 2.5882 ticks/deg (0.3864 deg/tick)








    audio:
      yaw_offset_deg: 0.0           # ReSpeaker microphone array angular mounting offset
      invert: true                  # ReSpeaker circular DOA is clockwise -> inverts to REP-103 CCW

    camera:
      yaw_offset_deg: 0.0           # OAK-D Lite horizontal optical axis calibration offset
      pitch_offset_deg: 0.0         # OAK-D Lite vertical optical axis calibration offset
      hfov_deg: 72.0                # OAK-D Lite Horizontal Field of View (degrees)
      vfov_deg: 53.0                # OAK-D Lite Vertical Field of View (degrees)
      focal_length_px: 512.0        # Baseline focal length for 640x480 resolution

