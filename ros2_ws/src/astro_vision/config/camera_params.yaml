/oak:
  ros__parameters:
    camera:
      i_nn_type: "none"
      i_enable_imu: false
    i_pipeline_type: "RGBD"
    rgb:
      i_resolution: "1080P"
      i_fps: 30.0
      i_publish_topic: true
    stereo:
      i_enabled: true
      i_depth_filter_size: 5
      i_lr_check: true

webcam_publisher_node:
  ros__parameters:
    # OAK-D yokken USB kamerayı aynı konuya yayınlar (source:=webcam)
    device: 0
    output_topic: "/oak/rgb/image_raw"
    width: 640
    height: 480
    # Kameranın kendi hızı. 30 FPS'lik sensörü 15 Hz'de okumak yükü yarıya indirmez;
    # sürücünün 4 karelik kuyruğunu doldurup orada bırakır — read() 0.26 ms'de döner
    # ama kare ~133 ms bayattır. Takip, kişinin bulunduğu yeri değil geçtiği yeri kovalar.
    fps: 30.0

face_detector_node:
  ros__parameters:
    input_topic: "/oak/rgb/image_raw"
    # 1 = her kare. Yüklü bir kare ~13.5 ms sürüyor, 30 FPS'in bütçesi 33 ms —
    # atlamaya gerek yok. Bunu büyütmek doğrudan takip gecikmesine dönüşür.
    process_every_n: 1
    # Cascade ayarı — yalnızca yunet.onnx kurulu DEĞİLKEN (Haar yedeği) etkili.
    # YuNet kendi ölçek aramasını yapar.
    scale_factor: 1.1
    min_neighbors: 5
    min_size: 36
