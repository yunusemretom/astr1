[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Seri port hız ayarı
monitor_speed = 115200

; Arduino Mega 2560 CH340 sabit port
upload_port = /dev/ttyCH341USB0
monitor_port = /dev/ttyCH341USB0

; Harici kütüphane gerekmiyor: TMC2209 (step motor) ve MPU-6050 (I2C)
; kaldırıldı, pinleri enkoderlere verildi. Bkz. include/pins.h
lib_deps =

build_flags =
  -O2
  ; Dikkat: bu satir su an etkisiz. Arduino AVR framework'u kendi -std=gnu++11'ini
  ; build_flags'ten SONRA ekliyor ve GCC'de sonuncu kazaniyor, yani proje aslinda
  ; C++11 olarak derleniyor. Bugun zararsiz (C++17'ye ozgu bir sey kullanilmiyor),
  ; ama biri "if constexpr" yazip burada gnu++17 yazdigi icin calismasini bekleyince
  ; anlasilmaz bir hata alir. Gercekten gerekirse: build_unflags = -std=gnu++11
  -std=gnu++17
  -DARDUINO_USB_MODE=1